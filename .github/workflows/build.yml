name: Build and publish image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish_arch_images:
        required: true
        type: boolean

env:
  HARBOR_IMAGE: registry.hanada.info/hanada/dnsmgr
  DOCKERHUB_IMAGE: docker.io/hanadalee/dnsmgr
  GHCR_IMAGE: ghcr.io/hanadalee/dnsmgr

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        if: inputs.publish_arch_images
        uses: docker/login-action@v4
        with:
          registry: registry.hanada.info
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to Docker Hub
        if: inputs.publish_arch_images
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: inputs.publish_arch_images
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish architecture image
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          file: .github/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.publish_arch_images }}
          provenance: false
          sbom: false
          build-args: |
            CACHE_BUST=${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
            DNSMGR_VERSION=${{ inputs.version }}
            DNSMGR_REPOSITORY=HanadaLee/dnsmgr
            DNSMGR_REF=ext
            DNSMGR_SOURCE_SHA=${{ github.sha }}
          tags: |
            ${{ env.HARBOR_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
            ${{ env.GHCR_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=dnsmgr-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=dnsmgr-${{ matrix.suffix }}
