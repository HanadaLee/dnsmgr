name: Build and publish image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish_image:
        required: true
        type: boolean

env:
  HARBOR_IMAGE: registry.hanada.info/hanada/dnsmgr
  DOCKERHUB_IMAGE: docker.io/hanadalee/dnsmgr
  GHCR_IMAGE: ghcr.io/hanadalee/dnsmgr

jobs:
  build:
    name: Build linux/amd64 and linux/arm64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        if: inputs.publish_image
        uses: docker/login-action@v4
        with:
          registry: registry.hanada.info
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to Docker Hub
        if: inputs.publish_image
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: inputs.publish_image
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          file: .github/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish_image }}
          provenance: false
          sbom: false
          build-args: |
            CACHE_BUST=${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
            DNSMGR_VERSION=${{ inputs.version }}
            DNSMGR_REPOSITORY=HanadaLee/dnsmgr
            DNSMGR_REF=ext
            DNSMGR_SOURCE_SHA=${{ github.sha }}
          tags: |
            ${{ env.HARBOR_IMAGE }}:${{ inputs.version }}
            ${{ env.HARBOR_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ inputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ inputs.version }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
