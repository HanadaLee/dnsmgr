name: CI and release

on:
  push:
    branches:
      - ext
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP test suite
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dnsmgr_test
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DNSMGR_TEST_DATABASE: '1'
      PHP_DATABASE_TYPE: mysql
      PHP_DATABASE_HOSTNAME: 127.0.0.1
      PHP_DATABASE_DATABASE: dnsmgr_test
      PHP_DATABASE_USERNAME: root
      PHP_DATABASE_PASSWORD: test
      PHP_DATABASE_HOSTPORT: '3306'
      PHP_DATABASE_CHARSET: utf8mb4
      PHP_DATABASE_PREFIX: dnsmgr_

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, ftp, gd, mbstring, openssl, pdo_mysql, sockets, ssh2, zip
          coverage: none
          tools: composer:v2

      - name: Locate Composer cache
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run tests
        run: composer test:ci

  prepare:
    name: Read version and determine release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_needed: ${{ steps.version.outputs.release_needed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2,4}$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi

          release_needed=false
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Version ${version} is already tagged; running tests only."
          else
            release_needed=true
            echo "Version ${version} is not tagged; publishing or retrying its release."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs:
      - prepare
      - test
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish_arch_images: ${{ needs.prepare.outputs.release_needed == 'true' }}
    secrets: inherit

  publish:
    name: Publish manifests and release
    if: needs.prepare.outputs.release_needed == 'true'
    needs:
      - prepare
      - build
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit
